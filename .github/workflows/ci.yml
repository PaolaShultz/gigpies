name: Rust
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication boundaries
        run: python3 scripts/check_publication.py
      - name: Install pinned toolchain and prepare build lock
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /home/shome/p
      - run: flock -xn /home/shome/p/.gigpies-build.lock cargo +1.97.1 fmt --all -- --check
      - run: flock -xn /home/shome/p/.gigpies-build.lock cargo +1.97.1 check --locked -j1
      - run: flock -xn /home/shome/p/.gigpies-build.lock cargo +1.97.1 clippy --locked -j1 --all-targets -- -D warnings
      - run: flock -xn /home/shome/p/.gigpies-build.lock cargo +1.97.1 test --locked -j1 --all-targets
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: flock -xn /home/shome/p/.gigpies-build.lock cargo +1.97.1 build --release --locked -j1
