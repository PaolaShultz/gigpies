<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">GigPies intended two-node architecture</title><desc id="desc">Sources enter the Stagebox for local mixing, monitors and PA processing. Recording stays on local Stagebox NVMe. Source audio and FX sends travel to Brain for analysis, effects and lighting. Parameter updates and wet FX return to Stagebox; Brain hosts an audio and a lighting console on two 1920 by 1080 monitors with two independently assigned MIDI controllers. Broad integration is planned; the stereo bench is separately qualified.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#46dce9"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#ffc176"/></marker></defs><rect width="1200" height="530" rx="18" fill="#0b1320"/>
<g font-family="DejaVu Sans, sans-serif"><text x="36" y="43" fill="#f0f5ff" font-size="22" font-weight="bold">Two nodes. One prepared show.</text><text x="36" y="70" fill="#91a3ba" font-size="14">Intended complete system · audio and lighting consoles · broader integration planned</text>
<rect x="36" y="105" width="370" height="225" rx="14" fill="#102837" stroke="#37cad7"/><text x="58" y="139" fill="#48deea" font-size="12" letter-spacing="2">STAGEBOX / MIXER</text><text x="58" y="176" fill="#f0f5ff" font-size="25" font-weight="bold">Keep audio local.</text><text x="58" y="215" fill="#c2cedd" font-size="16">Inputs → channel DSP → buses</text><text x="58" y="245" fill="#c2cedd" font-size="16">Monitors · protection · NVMe recording</text><text x="58" y="294" fill="#88a6b8" font-size="13">Owns the latency-critical audio path</text>
<rect x="794" y="105" width="370" height="225" rx="14" fill="#262132" stroke="#b497e9"/><text x="816" y="139" fill="#c6aff4" font-size="12" letter-spacing="2">BRAIN / TWO OPERATOR CONSOLES</text><text x="816" y="176" fill="#f0f5ff" font-size="25" font-weight="bold">Mix. Program. Play.</text><text x="816" y="215" fill="#c2cedd" font-size="16">SHR Desk audio + SHR Lightdesk</text><text x="816" y="245" fill="#c2cedd" font-size="16">Analysis · FX · SHR Lux engine</text><text x="816" y="294" fill="#a89cbe" font-size="13">Human operation · MANUAL / ASSIST / AUTO</text>
<path d="M422 185H778" stroke="#46dce9" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="171" text-anchor="middle" fill="#a9dae3" font-size="14">Source audio + FX sends + status</text><path d="M778 248H422" stroke="#ffc176" stroke-width="2" marker-end="url(#amber)"/><text x="600" y="277" text-anchor="middle" fill="#e9c49c" font-size="14">Parameter updates + wet FX</text><text x="600" y="219" text-anchor="middle" fill="#6d879d" font-size="11" letter-spacing="2">DEDICATED ETHERNET</text>
<path d="M220 330V363" stroke="#46dce9" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="375" width="370" height="55" rx="10" fill="#14212e"/><text x="221" y="409" text-anchor="middle" fill="#e4edf8" font-size="16">PA outputs + independent monitors</text><path d="M979 330V363" stroke="#46dce9" stroke-width="2" marker-end="url(#arrow)"/><rect x="794" y="375" width="370" height="55" rx="10" fill="#211d2e"/><text x="979" y="409" text-anchor="middle" fill="#e4edf8" font-size="16">2 × 1080p + 2 MIDI controllers</text>
<path d="M36 460H1164" stroke="#28384b"/><text x="36" y="493" fill="#ffc176" font-size="14">FIRST SLICE</text><text x="150" y="493" fill="#a7b7ca" font-size="14">Original multitracks → measurements → balance → listen and refine</text></g></svg>