[package]
name = "gigpies"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Experimental live-band soundcheck and show automation"
license = "MIT"
repository = "https://github.com/PaolaShultz/gigpies"
publish = false

[dependencies]
hound = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
