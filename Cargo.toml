[package]
name = "gigpies"
default-run = "gigpies"
version = "0.2.3"
edition = "2024"
rust-version = "1.97.1"
description = "Experimental live-band audio and lighting system"
license = "MIT"
repository = "https://github.com/PaolaShultz/gigpies"
publish = false

[dependencies]
hound = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
rtrb = "=0.4.0"
rubato = { version = "=5.0.1", default-features = false }
socket2 = "=0.6.5"
alsa = { version = "=0.11.0", optional = true }
libloading = { version = "=0.7.4", optional = true }
libc = "=0.2.189"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync", "io-util"] }
bytes = "=1.12.1"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[features]
hardware-host = ["dep:alsa", "dep:libloading"]

[[bin]]
name = "gigpies-hardware"
path = "src/bin/hardware.rs"
required-features = ["hardware-host"]

[[bin]]
name = "gigpies-remote"
path = "src/bin/remote.rs"
required-features = ["hardware-host"]

[[bin]]
name = "gigpies-brain"
path = "src/bin/brain.rs"
required-features = ["hardware-host"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
